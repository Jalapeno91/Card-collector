<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>The Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1b1f2b; --ink-2:#242939; --panel:#2a3040; --panel-2:#333a4d;
    --brass:#c9a227; --brass-dim:#8c7627; --rose:#b8594d;
    --parchment:#ece6d6; --parchment-dim:#9aa0b4; --hairline:#3d4358; --radius:4px;
    --accent: #c9a227;
  }
  * { box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100%; background:var(--ink); color:var(--parchment); font-family:'IBM Plex Sans',sans-serif; transition: background-color .35s ease; }
  ::selection{ background:var(--brass); color:var(--ink); }
  button{ font-family:inherit; }

  .app{ display:flex; min-height:100vh; }

  .sidebar{ width:250px; flex-shrink:0; background:var(--ink-2); border-right:1px solid var(--hairline); padding:28px 0 20px; display:flex; flex-direction:column; transition: background-color .35s ease, border-color .35s ease; }
  .brand{ padding:0 22px 20px; border-bottom:1px solid var(--hairline); margin-bottom:8px; cursor:pointer; }
  .brand .mark{ font-family:'Fraunces',serif; font-size:14px; letter-spacing:.14em; color:var(--brass); text-transform:uppercase; }
  .brand h1{ font-family:'Fraunces',serif; font-weight:600; font-size:25px; margin:6px 0 0; }
  .brand .sub{ color:var(--parchment-dim); font-size:12px; margin-top:4px; font-family:'IBM Plex Mono',monospace; }

  .coll-list{ flex:1; overflow-y:auto; padding:6px 0; }
  .coll-item{ padding:11px 22px 11px 18px; cursor:pointer; border-left:3px solid transparent; transition:background .12s; }
  .coll-item:hover{ background:var(--panel); }
  .coll-item.active{ background:var(--panel); border-left-color: var(--dot, var(--brass)); }
  .coll-item .row{ display:flex; align-items:center; gap:9px; }
  .coll-item .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; background:var(--dot); }
  .coll-item .nm{ font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .coll-item .bar{ height:3px; background:var(--hairline); border-radius:2px; margin-top:8px; overflow:hidden; }
  .coll-item .bar-fill{ height:100%; background:var(--dot); }

  .sidebar-foot{ padding:14px 22px 0; border-top:1px solid var(--hairline); }
  .ghost-btn{ width:100%; padding:9px 10px; font-size:13px; background:transparent; border:1px dashed var(--hairline); color:var(--parchment-dim); border-radius:var(--radius); cursor:pointer; }
  .ghost-btn:hover{ border-color:var(--brass); color:var(--brass); }

  .main{ flex:1; padding:34px 40px 48px; max-width:1140px; }
  .crumbs{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--parchment-dim); margin-bottom:18px; }
  .crumbs span{ cursor:pointer; }
  .crumbs span:hover{ color:var(--brass); }
  .crumbs .sep{ margin:0 6px; cursor:default; }

  h2.section-title{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0 0 6px; display:flex; align-items:center; gap:14px; }
  .header-actions{ display:flex; gap:8px; margin-left:auto; }
  .icon-btn{ background:none; border:1px solid var(--hairline); color:var(--parchment-dim); cursor:pointer; padding:6px 10px; border-radius:var(--radius); font-size:13px; }
  .icon-btn:hover{ color:var(--parchment); border-color:var(--parchment-dim); }
  .icon-btn.danger:hover{ color:var(--rose); border-color:var(--rose); }

  .progress-block{ margin: 14px 0 26px; }
  .progress-label{ display:flex; justify-content:space-between; font-size:12px; color:var(--parchment-dim); margin-bottom:6px; font-family:'IBM Plex Mono',monospace; }
  .progress-bar{ height:8px; background:var(--panel); border:1px solid var(--hairline); border-radius:6px; overflow:hidden; }
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, white)); transition: width .3s ease; }
  .progress-empty-note{ font-size:12px; color:var(--parchment-dim); margin-top:6px; }
  .progress-empty-note button{ background:none;border:none;color:var(--brass);cursor:pointer;padding:0;text-decoration:underline;font-size:12px; }

  .tile-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:16px; margin-top:8px; }
  .tile{ background:var(--panel); border:1px solid var(--hairline); border-radius:6px; overflow:hidden; cursor:pointer; transition: transform .12s ease, border-color .12s ease; position:relative; }
  .tile:hover{ transform: translateY(-2px); border-color: var(--dot); }
  .tile .topbar{ height:6px; background:var(--dot); }
  .tile .body{ padding:16px 18px 18px; }
  .tile .t-name{ font-family:'Fraunces',serif; font-size:17px; margin-bottom:4px; }
  .tile .t-meta{ font-size:12px; color:var(--parchment-dim); font-family:'IBM Plex Mono',monospace; margin-bottom:12px; }
  .tile .bar{ height:6px; background:var(--ink-2); border-radius:4px; overflow:hidden; border:1px solid var(--hairline); }
  .tile .bar-fill{ height:100%; background:var(--dot); }
  .tile .tile-actions{ position:absolute; top:12px; right:10px; display:flex; gap:4px; opacity:0; transition:opacity .12s; }
  .pocket .tile-actions{ position:absolute; top:8px; right:8px; display:flex; gap:4px; opacity:0; transition:opacity .12s; z-index:3; }
  .tile:hover .tile-actions{ opacity:1; }
  .pocket:hover .tile-actions{ opacity:1; }
  .tile-actions button{ background:rgba(0,0,0,.35); border:none; color:var(--parchment); border-radius:3px; padding:4px 7px; cursor:pointer; font-size:12px; backdrop-filter: blur(2px); }
  .tile-actions button:hover{ background:rgba(0,0,0,.6); }
  .tile.add-tile{ display:flex; align-items:center; justify-content:center; min-height:112px; border-style:dashed; color:var(--parchment-dim); }
  .tile.add-tile:hover{ color:var(--brass); border-color:var(--brass); }

  .toolbar{ display:flex; align-items:center; gap:12px; margin:22px 0 16px; }
  .search{ flex:1; background:var(--panel); border:1px solid var(--hairline); color:var(--parchment); padding:10px 14px; border-radius:var(--radius); font-size:14px; }
  .search:focus{ outline:none; border-color:var(--accent); }
  select.rarity-filter{ background:var(--panel); border:1px solid var(--hairline); color:var(--parchment); padding:10px 12px; border-radius:var(--radius); font-size:13px; }
  .btn-primary{ background:var(--accent); color:var(--ink); border:none; padding:10px 18px; border-radius:var(--radius); font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap; }
  .btn-primary:hover{ filter:brightness(1.1); }

  .ledger{ border:1px solid var(--hairline); border-radius:var(--radius); overflow:hidden; }
  .ledger-row{ display:grid; grid-template-columns: 1fr 110px 130px 90px 70px 76px; gap:10px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--hairline); font-size:13.5px; cursor:pointer; }
  .ledger-row.head{ background:var(--panel-2); text-transform:uppercase; letter-spacing:.06em; font-size:11px; color:var(--parchment-dim); font-family:'IBM Plex Mono',monospace; cursor:default; }
  .ledger-row:not(.head){ background:var(--panel); }
  .ledger-row:not(.head):hover{ background:var(--panel-2); }
  .ledger-row:last-child{ border-bottom:none; }
  .cell-name{ font-weight:500; }
  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:2px 9px; border-radius:10px; font-family:'IBM Plex Mono',monospace; border:1px solid; }
  .fx-tag{ font-size:11px; color:var(--parchment-dim); font-family:'IBM Plex Mono',monospace; }
  .qty{ font-family:'IBM Plex Mono',monospace; color:var(--accent); }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }
  .row-actions button{ background:none; border:none; color:var(--parchment-dim); cursor:pointer; font-size:14px; }
  .row-actions button:hover{ color:var(--brass); }
  .row-actions button.danger:hover{ color:var(--rose); }

  .empty-state{ text-align:center; padding:56px 20px; color:var(--parchment-dim); border:1px dashed var(--hairline); border-radius:var(--radius); }
  .empty-state .stamp{ font-family:'Fraunces',serif; font-size:17px; color:var(--parchment); margin-bottom:6px; }

  .overlay{ position:fixed; inset:0; background:rgba(10,12,18,.75); display:none; align-items:center; justify-content:center; z-index:60; padding:20px; }
  .overlay.open{ display:flex; }
  .modal{ background:var(--ink-2); border:1px solid var(--hairline); border-radius:6px; width:460px; max-width:100%; padding:26px 28px 24px; max-height:88vh; overflow-y:auto; }
  .modal h3{ font-family:'Fraunces',serif; font-size:20px; margin:0 0 18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--parchment-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .field input, .field select, .field textarea{ width:100%; background:var(--panel); border:1px solid var(--hairline); color:var(--parchment); padding:9px 12px; border-radius:var(--radius); font-size:14px; font-family:inherit; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--brass); }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .field input[type=color]{ padding:3px; height:38px; cursor:pointer; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .btn-ghost{ background:transparent; border:1px solid var(--hairline); color:var(--parchment-dim); padding:9px 16px; border-radius:var(--radius); cursor:pointer; font-size:14px; }
  .btn-ghost:hover{ color:var(--parchment); border-color:var(--parchment-dim); }
  .btn-ghost.danger{ color:var(--rose); border-color:var(--rose); }
  .btn-ghost.danger:hover{ background: rgba(184,89,77,.12); }

  .effect-picker{ display:grid; grid-template-columns: repeat(4,1fr); gap:8px; }
  .effect-opt{ border:1px solid var(--hairline); border-radius:var(--radius); padding:10px 6px; text-align:center; cursor:pointer; font-size:12px; color:var(--parchment-dim); }
  .effect-opt .glyph{ font-size:17px; display:block; margin-bottom:4px; }
  .effect-opt:hover{ border-color:var(--parchment-dim); color:var(--parchment); }
  .effect-opt.sel{ border-color:var(--brass); color:var(--brass); background:rgba(201,162,39,.08); }

  .rarity-manage-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; max-height:180px; overflow-y:auto; }
  .rarity-manage-row{ display:flex; align-items:center; gap:8px; }
  .rarity-manage-row input[type=text]{ flex:1; }
  .rarity-manage-row input[type=color]{ width:40px; padding:2px; height:34px; }
  .rarity-manage-row button{ background:none; border:none; color:var(--parchment-dim); cursor:pointer; }
  .rarity-manage-row button:hover{ color:var(--rose); }
  .coll-logo{ display:inline-block; border-radius:6px; background:var(--panel-2); background-size:cover; background-position:center; vertical-align:middle; flex-shrink:0; border:1px solid var(--hairline); }
  .rarity-manage-row input.rc-total{ width:84px; flex:none; }
  .rarity-add-row{ display:flex; gap:8px; }
  .rarity-add-row input[type=number]{ width:84px; flex:none; }

  .link-row{ display:grid; grid-template-columns: 1fr 1fr 1fr 66px 28px; gap:6px; margin-bottom:8px; align-items:center; }
  .link-row select, .link-row input{ font-size:12px; padding:7px 8px; }
  .link-row button{ background:none; border:none; color:var(--parchment-dim); cursor:pointer; }
  .link-row button:hover{ color:var(--rose); }
  .add-link-btn{ margin-top:2px; }

  .pocket.linked-pocket .pocket-face{ display:flex; align-items:center; justify-content:center; border-bottom:3px dashed var(--rc, var(--hairline)); opacity:.82; }
  .pocket.linked-pocket .pocket-mono{ font-size:26px; }
  .slot-chip.linked{ position:relative; font-weight:700; }
  .slot-chip.linked::after{ content:'🔗'; position:absolute; font-size:8px; bottom:-3px; right:-3px; }

  .badge-complete{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-family:'IBM Plex Mono',monospace; letter-spacing:.05em; text-transform:uppercase; padding:3px 9px; border-radius:10px; background:linear-gradient(135deg, var(--brass), #efd77a); color:#1b1f2b; font-weight:700; box-shadow:0 2px 6px rgba(201,162,39,.35); vertical-align:middle; }
  .badge-complete-mini{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; background:var(--brass); color:#1b1f2b; font-size:10px; font-weight:700; margin-left:6px; vertical-align:middle; }
  .rarity-breakdown{ display:flex; flex-direction:column; gap:9px; margin: 2px 0 24px; padding:14px 16px; background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius); }
  .rb-row{ display:grid; grid-template-columns: 120px 1fr 90px; align-items:center; gap:10px; font-size:12px; }
  .rb-name{ font-family:'IBM Plex Mono',monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rb-bar{ height:6px; background:var(--ink-2); border-radius:4px; overflow:hidden; border:1px solid var(--hairline); }
  .rb-fill{ height:100%; }
  .rb-count{ text-align:right; font-family:'IBM Plex Mono',monospace; color:var(--parchment-dim); }

  .series-banner{ height:130px; border-radius:6px; background:var(--panel); background-size:cover; background-position:center; border:1px solid var(--hairline); margin-bottom:18px; }

  .tile .topbar.has-photo{ height:64px; background-size:cover; background-position:center; }

  .view-toggle{ display:flex; border:1px solid var(--hairline); border-radius:var(--radius); overflow:hidden; flex-shrink:0; }
  .view-toggle button{ background:var(--panel); border:none; color:var(--parchment-dim); padding:9px 14px; cursor:pointer; font-size:13px; }
  .view-toggle button.active{ background:var(--accent); color:var(--ink); font-weight:600; }

  .binder-page{ display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; background:var(--ink-2); border:1px solid var(--hairline); border-radius:8px; padding:22px; position:relative; }
  .pocket{ aspect-ratio: 2.5 / 3.5; border-radius:6px; overflow:hidden; cursor:pointer; position:relative; border:1px solid var(--hairline); background:var(--panel); box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 6px 14px rgba(0,0,0,.35); transition: transform .15s ease; display:flex; flex-direction:column; }
  .pocket:hover{ transform: translateY(-3px) scale(1.02); }
  .pocket-face{ flex:1; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; position:relative; border-bottom:3px solid var(--rc, var(--hairline)); }
  .pocket-mono{ font-family:'Fraunces',serif; font-size:32px; color:rgba(255,255,255,.75); }
  .pocket-name{ position:absolute; bottom:4px; left:6px; right:6px; font-size:10px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.75); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pocket-foot{ display:flex; justify-content:space-between; padding:5px 7px; font-size:10px; font-family:'IBM Plex Mono',monospace; background:var(--panel-2); }
  .pocket.add-pocket{ display:flex; align-items:center; justify-content:center; border-style:dashed; color:var(--parchment-dim); font-size:26px; background:transparent; }
  .pocket.add-pocket:hover{ color:var(--brass); border-color:var(--brass); }
  .pocket.empty-pocket{ background:transparent; }
  .pocket-face.empty{ display:flex; align-items:center; justify-content:center; border-bottom:3px dashed var(--rc, var(--hairline)); background: repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 6px, transparent 6px 12px); }
  .pocket-slot-number{ font-family:'IBM Plex Mono',monospace; color:var(--parchment-dim); font-size:13px; }

  .overview-wrap{ display:flex; flex-direction:column; gap:18px; }
  .overview-section{ background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius); padding:14px 16px; }
  .overview-head{ display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:12px; margin-bottom:10px; }
  .overview-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .slot-chip{ width:28px; height:28px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:10px; font-family:'IBM Plex Mono',monospace; cursor:pointer; transition: transform .1s ease; }
  .slot-chip:hover{ transform: scale(1.12); }
  .slot-chip.empty{ background:transparent; border:1px dashed var(--hairline); color:var(--parchment-dim); }
  .slot-chip.filled{ font-weight:700; }
  .binder-pager{ display:flex; align-items:center; justify-content:center; gap:16px; margin-top:16px; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--parchment-dim); }
  .binder-pager button{ background:var(--panel); border:1px solid var(--hairline); color:var(--parchment); padding:7px 14px; border-radius:var(--radius); cursor:pointer; }
  .binder-pager button:disabled{ opacity:.35; cursor:default; }

  .viewer-overlay{ position:fixed; inset:0; background:rgba(8,9,14,.88); display:none; align-items:center; justify-content:center; z-index:80; flex-direction:column; padding:20px;}
  .viewer-overlay.open{ display:flex; }
  .viewer-close{ position:absolute; top:22px; right:28px; background:none; border:1px solid var(--hairline); color:var(--parchment-dim); border-radius:50%; width:36px; height:36px; cursor:pointer; font-size:16px; }
  .viewer-close:hover{ color:var(--parchment); border-color:var(--parchment); }
  .stage-wrap{ perspective:1200px; }
  .card3d{ position:relative; width:280px; height:392px; border-radius:16px; box-shadow:0 30px 60px rgba(0,0,0,.55); transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.8,.2,1); will-change: transform; }
  .card3d.live{ transition: transform .05s linear; }
  .c-face{ position:absolute; inset:0; border-radius:16px; overflow:hidden; display:flex; flex-direction:column; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .c-face-back{ transform: rotateY(180deg); }
  .c-base{ position:absolute; inset:0; background-size:cover; background-position:center; }
  .c-scrim{ position:absolute; inset:0; background: linear-gradient(to top, rgba(0,0,0,.62), rgba(0,0,0,0) 55%); }
  .c-fx{ position:absolute; inset:0; pointer-events:none; }
  .fx-matte{ background: repeating-linear-gradient(45deg, rgba(255,255,255,.045) 0 2px, transparent 2px 7px); opacity:.5; }
  .fx-shiny{ background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.9), rgba(255,255,255,0) 42%); mix-blend-mode: overlay; opacity:.9; }
  .fx-holo{
    background: repeating-linear-gradient(calc(115deg + var(--ry,0)*1deg),
      rgba(255,80,170,.4) 0%, rgba(255,225,60,.4) 12%, rgba(90,255,200,.4) 24%,
      rgba(90,150,255,.4) 36%, rgba(220,90,255,.4) 48%, rgba(255,80,170,.4) 60%);
    background-size: 220% 220%;
    background-position: calc(50% + var(--ry,0)*2.2%) calc(50% + var(--rx,0)*2.2%);
    mix-blend-mode: color-dodge; opacity:.7;
  }
  .fx-holo::after{ content:''; position:absolute; inset:0; background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.55), transparent 40%); mix-blend-mode: overlay; }
  .fx-lenticular{
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 3px, rgba(0,0,0,.22) 3px 7px);
    background-position: calc(var(--ry,0) * 2.4px) 0;
    mix-blend-mode: overlay; opacity:.55;
  }
  .c-content{ position:relative; z-index:2; flex:1; display:flex; flex-direction:column; padding:18px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .c-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; opacity:.85; }
  .c-title{ font-family:'Fraunces',serif; font-weight:700; font-size:22px; margin-top:8px; line-height:1.15; }
  .c-emblem{ flex:1; display:flex; align-items:center; justify-content:center; }
  .c-emblem .ring{ width:104px; height:104px; border-radius:50%; border:2px solid rgba(255,255,255,.55); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:40px; background:rgba(255,255,255,.08); }
  .c-rarity-band{ display:flex; justify-content:space-between; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:11px; padding-top:10px; border-top:1px solid rgba(255,255,255,.3); }
  .viewer-meta{ margin-top:22px; text-align:center; max-width:340px; }
  .viewer-meta .fx-hint{ font-size:12px; color:var(--parchment-dim); margin-top:4px; }
  .viewer-meta .notes{ font-size:13px; color:var(--parchment-dim); margin-top:10px; font-style:italic; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--brass); color:var(--ink); padding:10px 20px; border-radius:var(--radius); font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:100; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  @media (max-width:800px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--hairline); }
    .ledger-row{ grid-template-columns: 1fr 90px 70px; }
    .ledger-row .rarity-cell, .ledger-row .fx-cell, .ledger-row .cond-cell{ display:none; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand" id="homeBtn">
      <div class="mark">Est. by you</div>
      <h1>The Ledger</h1>
      <div class="sub">card collection archive</div>
    </div>
    <div class="coll-list" id="collList"></div>
    <div class="sidebar-foot">
      <button class="ghost-btn" id="addCollBtn">+ new collection</button>

<script>
const STORAGE_KEY = 'ledger-data-v2';
const EFFECTS = {
  matte:  { label:'Matte',        glyph:'●' },
  shiny:  { label:'Shiny',        glyph:'✦' },
  holo:   { label:'Holographic',  glyph:'◈' },
  lenticular: { label:'Lenticular', glyph:'▤' },
};
const DEFAULT_RARITY_PALETTE = ['#8ab6ff','#a5e0a0','#e0b866','#e08585','#c79cf0','#f0e08a'];

const BASE = { ink:'#1b1f2b', ink2:'#242939', panel:'#2a3040', panel2:'#333a4d', hairline:'#3d4358', accent:'#c9a227' };

function hexToRgb(hex){
  hex = hex.replace('#','');
  if (hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function mixHex(hexA, hexB, t){
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  return rgbToHex(a.r+(b.r-a.r)*t, a.g+(b.g-a.g)*t, a.b+(b.b-a.b)*t);
}

function applyTheme(hex){
  const root = document.documentElement.style;
  root.setProperty('--accent', hex);
  root.setProperty('--ink', mixHex(BASE.ink, hex, 0.10));
  root.setProperty('--ink-2', mixHex(BASE.ink2, hex, 0.12));
  root.setProperty('--panel', mixHex(BASE.panel, hex, 0.14));
  root.setProperty('--panel-2', mixHex(BASE.panel2, hex, 0.16));
  root.setProperty('--hairline', mixHex(BASE.hairline, hex, 0.22));
}
function resetTheme(){
  const root = document.documentElement.style;
  root.setProperty('--accent', BASE.accent);
  root.setProperty('--ink', BASE.ink);
  root.setProperty('--ink-2', BASE.ink2);
  root.setProperty('--panel', BASE.panel);
  root.setProperty('--panel-2', BASE.panel2);
  root.setProperty('--hairline', BASE.hairline);
}

let data = { collections: [] };
let nav = { collectionId: null, subId: null };
let editing = { collId: null, subId: null, cardId: null };
let pendingRarities = [];
let pendingLinkedSlots = [];
let confirmAction = null;

const el = id => document.getElementById(id);
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function showToast(msg){ const t=el('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),1800); }

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    data = res && res.value ? JSON.parse(res.value) : { collections: [] };
  }catch(e){ data = { collections: [] }; }
  migrateRaritiesToSubcollections();
  render();
}
function migrateRaritiesToSubcollections(){
  let changed = false;
  data.collections.forEach(c => {
    (c.subcollections||[]).forEach(s => {
      if (!s.rarities){
        s.rarities = (c.rarities||[]).map(r => ({...r}));
        changed = true;
      }
    });
    if (c.rarities){ delete c.rarities; changed = true; }
  });
  if (changed) saveData();
}
async function saveData(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(data), false); }
  catch(e){ showToast('Could not save — try again'); }
}

function collectAllPhotoKeys(){
  const keys = [];
  data.collections.forEach(c => {
    (c.subcollections||[]).forEach(s => {
      if (s.hasBoxPhoto) keys.push(boxPhotoKey(s.id));
      (s.cards||[]).forEach(card => {
        if (card.hasPhoto) keys.push(photoKey(card.id));
        if (card.hasBackPhoto) keys.push(photoBackKey(card.id));
      });
    });
  });
  return keys;
}

async function exportBackup(){
  showToast('Preparing backup…');
  const keys = collectAllPhotoKeys();
  const photos = {};
  for (const key of keys){
    try{
      const res = await window.storage.get(key, false);
      if (res && res.value) photos[key] = res.value;
    }catch(e){ /* skip a photo that failed to load — the rest of the backup still proceeds */ }
  }
  const payload = { app:'the-ledger', version:1, exportedAt: new Date().toISOString(), data, photos };
  const blob = new Blob([JSON.stringify(payload)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `card-ledger-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}

async function performRestore(parsed){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(parsed.data), false); }
  catch(e){ showToast('Restore failed — the backup may be too large'); return; }
  const photos = parsed.photos || {};
  for (const key of Object.keys(photos)){
    try{ await window.storage.set(key, photos[key], false); }
    catch(e){ /* skip a photo that failed to restore — the rest still proceeds */ }
  }
  nav = { collectionId: null, subId: null };
  await loadData();
  showToast('Backup restored');
}

el('exportBackupBtn').onclick = exportBackup;
el('importBackupBtn').onclick = () => el('importBackupInput').click();
el('importBackupInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    let parsed;
    try{ parsed = JSON.parse(ev.target.result); }
    catch(err){ showToast('That file is not a valid backup'); e.target.value=''; return; }
    if (!parsed || !parsed.data || !Array.isArray(parsed.data.collections)){
      showToast('That file is not a valid backup'); e.target.value=''; return;
    }
    openConfirm(
      'Restore this backup?',
      `This replaces everything currently in the app — collections, series, cards, and photos — with the contents of this file${parsed.exportedAt ? ' (exported '+new Date(parsed.exportedAt).toLocaleDateString()+')' : ''}. This can't be undone.`,
      () => performRestore(parsed),
      { okLabel: 'Restore backup', okColor: 'var(--accent)' }
    );
    e.target.value = '';
  };
  reader.onerror = () => showToast('Could not read that file');
  reader.readAsText(file);
};

function getColl(id){ return data.collections.find(c => c.id === id); }
function getSortedCollections(){ return [...data.collections].sort((a,b) => a.name.localeCompare(b.name)); }
function getSub(collId, subId){ const c = getColl(collId); return c ? c.subcollections.find(s => s.id === subId) : null; }
function ownedUnique(sub){ return sub.cards.filter(c => Number(c.qty||0) > 0).length; }

function buildLinkedSlotMap(){
  const map = {};
  data.collections.forEach(c => {
    (c.subcollections||[]).forEach(s => {
      (s.cards||[]).forEach(card => {
        if (Number(card.qty||0) <= 0) return;
        (card.linkedSlots||[]).forEach(link => {
          if (!link || !link.collId || !link.subId || !link.rarity || link.number == null) return;
          const key = link.collId+'|'+link.subId+'|'+link.rarity+'|'+link.number;
          map[key] = { card, homeCollId: c.id, homeSubId: s.id };
        });
      });
    });
  });
  return map;
}

function subRarityBreakdown(coll, sub){
  const groups = buildBinderSlots(coll, sub, null);
  return groups.filter(g => g.rarity.name !== 'Unsorted').map(g => {
    const owned = g.slots.filter(s => (s.card && Number(s.card.qty||0) > 0) || s.linked).length;
    return { ...g.rarity, owned };
  });
}
function subProgress(coll, sub){
  const breakdown = subRarityBreakdown(coll, sub);
  const owned = (sub.rarities && sub.rarities.length) ? breakdown.reduce((a,r) => a + r.owned, 0) : ownedUnique(sub);
  const perRarityTotal = breakdown.reduce((a,r) => a + (Number(r.total)||0), 0);
  const anyRarityTotal = breakdown.some(r => r.total);
  let total = null;
  if (anyRarityTotal) total = perRarityTotal;
  else if (sub.totalInSet) total = sub.totalInSet;
  if (!total) return { owned, total:null, pct:null, breakdown };
  return { owned, total, pct: Math.min(100, Math.round((owned/total)*100)), breakdown };
}
function collProgress(coll){
  let owned=0, total=0, any=false;
  coll.subcollections.forEach(s => {
    const sp = subProgress(coll, s);
    owned += sp.owned;
    if (sp.total != null){ total += sp.total; any = true; }
  });
  if (!any) return { owned, total:null, pct:null };
  return { owned, total, pct: Math.min(100, Math.round((owned/total)*100)) };
}

function render(){
  renderSidebar();
  if (!nav.collectionId){ resetTheme(); renderHome(); }
  else{
    const coll = getColl(nav.collectionId);
    if (!coll){ nav.collectionId=null; nav.subId=null; resetTheme(); renderHome(); return; }
    applyTheme(coll.color);
    if (!nav.subId){ renderCollection(coll); }
    else{
      const sub = getSub(coll.id, nav.subId);
      if (!sub){ nav.subId=null; renderCollection(coll); return; }
      renderSubcollection(coll, sub);
    }
  }
  hydrateCollLogos();
}

function collLogoTag(coll, sizePx){
  return coll.hasLogo ? `<span class="coll-logo" data-logo-id="${coll.id}" style="width:${sizePx}px; height:${sizePx}px;"></span>` : '';
}
function hydrateCollLogos(){
  const ids = new Set();
  document.querySelectorAll('.coll-logo[data-logo-id]').forEach(node => ids.add(node.dataset.logoId));
  ids.forEach(id => {
    window.storage.get(logoKey(id), false).then(res => {
      if (res && res.value){
        document.querySelectorAll(`.coll-logo[data-logo-id="${id}"]`).forEach(node => { node.style.backgroundImage = `url(${res.value})`; });
      }
    }).catch(() => {});
  });
}

function renderSidebar(){
  const list = el('collList');
  list.innerHTML = '';
  getSortedCollections().forEach(c => {
    const p = collProgress(c);
    const item = document.createElement('div');
    item.className = 'coll-item' + (nav.collectionId===c.id ? ' active':'');
    item.style.setProperty('--dot', c.color);
    item.innerHTML = `<div class="row">${collLogoTag(c, 18)}<span class="dot"></span><span class="nm">${escapeHtml(c.name)}</span>${p.pct===100 && p.total!=null ? '<span class="badge-complete-mini" title="Complete">✓</span>' : ''}</div>
      <div class="bar"><div class="bar-fill" style="width:${p.pct==null?0:p.pct}%"></div></div>`;
    item.onclick = () => { nav.collectionId = c.id; nav.subId = null; render(); };
    list.appendChild(item);
  });
}

el('homeBtn').onclick = () => { nav.collectionId=null; nav.subId=null; render(); };

function renderHome(){
  const main = el('mainView');
  let tiles = getSortedCollections().map(c => {
    const p = collProgress(c);
    return `<div class="tile" data-coll="${c.id}" style="--dot:${c.color}">
      <div class="topbar"></div>
      <div class="body">
        <div class="t-name">${collLogoTag(c, 28)} ${escapeHtml(c.name)}${p.pct===100 && p.total!=null ? ' <span class="badge-complete">✓ Complete</span>' : ''}</div>
        <div class="t-meta">${c.subcollections.length} series · ${p.total!=null ? p.pct+'% complete' : 'no target set'}</div>
        <div class="bar"><div class="bar-fill" style="width:${p.pct==null?0:p.pct}%"></div></div>
      </div>
      <div class="tile-actions">
        <button data-act="edit-coll" data-id="${c.id}" title="Edit">✎</button>
        <button data-act="del-coll" data-id="${c.id}" title="Delete">✕</button>
      </div>
    </div>`;
  }).join('');

  main.innerHTML = `
    <h2 class="section-title">All Collections</h2>
    <div class="tile-grid">
      ${tiles}
      <div class="tile add-tile" id="addTileHome"><div>+ New collection</div></div>
    </div>
  `;

  main.querySelectorAll('.tile[data-coll]').forEach(t => {
    t.onclick = (e) => { if (e.target.closest('.tile-actions')) return; nav.collectionId = t.dataset.coll; nav.subId=null; render(); };
  });
  main.querySelectorAll('[data-act="edit-coll"]').forEach(b => b.onclick = (e) => { e.stopPropagation(); openEditCollection(b.dataset.id); });
  main.querySelectorAll('[data-act="del-coll"]').forEach(b => b.onclick = (e) => { e.stopPropagation(); confirmDeleteCollection(b.dataset.id); });
  el('addTileHome').onclick = openAddCollection;
}

function renderCollection(coll){
  const main = el('mainView');
  const p = collProgress(coll);

  const tiles = coll.subcollections.map(s => {
    const sp = subProgress(coll, s);
    return `<div class="tile" data-sub="${s.id}" style="--dot:${coll.color}">
      <div class="topbar${s.hasBoxPhoto ? ' has-photo' : ''}" data-topper="${s.id}"></div>
      <div class="body">
        <div class="t-name">${escapeHtml(s.name)}${sp.pct===100 && sp.total!=null ? ' <span class="badge-complete">✓ Complete</span>' : ''}</div>
        <div class="t-meta">${sp.total!=null ? sp.owned+' / '+sp.total+' owned' : sp.owned+' logged · no target'}</div>
        <div class="bar"><div class="bar-fill" style="width:${sp.pct==null?0:sp.pct}%"></div></div>
      </div>
      <div class="tile-actions">
        <button data-act="edit-sub" data-id="${s.id}" title="Edit">✎</button>

let ledgerSearch = '';
let ledgerRarityFilter = '';
let viewMode = 'ledger';
let binderPage = 0;
let lastBinderSubId = null;

function getFilteredCards(sub){
  const q = ledgerSearch.trim().toLowerCase();
  return sub.cards.filter(c => {
    if (ledgerRarityFilter && c.rarity !== ledgerRarityFilter) return false;
    if (q && !`${c.name} ${c.notes}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b) => (a.name||'').localeCompare(b.name||''));
}

function renderRarityBreakdownHtml(sp){
  if (!sp.breakdown || sp.breakdown.length === 0) return '';
  return `<div class="rarity-breakdown">
    ${sp.breakdown.map(r => {
      const pct = r.total ? Math.min(100, Math.round((r.owned/r.total)*100)) : null;
      return `<div class="rb-row">
        <span class="rb-name" style="color:${r.color}">${escapeHtml(r.name)}${pct===100 ? '<span class="badge-complete-mini" title="Complete">✓</span>' : ''}</span>
        <div class="rb-bar"><div class="rb-fill" style="width:${pct==null?0:pct}%; background:${r.color};"></div></div>
        <span class="rb-count">${r.total!=null ? r.owned+' / '+r.total : r.owned+' owned'}</span>
      </div>`;
    }).join('')}
  </div>`;
}

      <div>${sub.cards.length===0 ? 'Add your first card to this series.' : 'Try a different search or filter.'}</div>

  }

  let rows = `<div class="ledger-row head">
    <div>Card</div><div class="rarity-cell">Rarity</div><div class="fx-cell">Effect</div><div class="cond-cell">Condition</div><div>Qty</div><div></div>
  </div>`;
  cards.forEach(c => {

      <div class="cell-name">${escapeHtml(c.name)}${c.hasPhoto ? ' <span title="Has a photo" style="opacity:.7;">📷</span>' : ''}${c.linkedSlots && c.linkedSlots.length ? ' <span title="Also counts toward other series" style="opacity:.7;">🔗</span>' : ''}</div>
      <div class="rarity-cell">${rarity ? `<span class="pill" style="border-color:${rarity.color}; color:${rarity.color};">${escapeHtml(rarity.name)}${c.number!=null ? ' #'+c.number : ''}</span>` : '—'}</div>

function buildBinderSlots(coll, sub, rarityFilter){
  const linkMap = buildLinkedSlotMap();
  const rarities = (sub.rarities||[]).filter(r => !rarityFilter || r.name === rarityFilter);
  const groups = rarities.map(r => {
    const cardsForRarity = sub.cards.filter(c => c.rarity === r.name);
    let maxNumber = 0;
    cardsForRarity.forEach(c => { if (c.number != null && Number(c.number) > maxNumber) maxNumber = Number(c.number); });
    Object.keys(linkMap).forEach(key => {
      const parts = key.split('|');
      if (parts[0]===coll.id && parts[1]===sub.id && parts[2]===r.name){
        const n = Number(parts[3]);
        if (n > maxNumber) maxNumber = n;
      }
    });
    const effectiveTotal = r.total || (maxNumber > 0 ? maxNumber : null);
    const isInferredTotal = !r.total && !!effectiveTotal;
    let slots;
    if (effectiveTotal){
      slots = [];
      for (let n=1; n<=effectiveTotal; n++){
        const card = cardsForRarity.find(c => Number(c.number)===n) || null;
        let linked = null;
        if (!card){
          const key = coll.id+'|'+sub.id+'|'+r.name+'|'+n;
          if (linkMap[key]) linked = linkMap[key];
        }
        slots.push({ number:n, card, linked });
      }
      const stray = cardsForRarity.filter(c => c.number==null || Number(c.number)<1 || Number(c.number)>effectiveTotal);
      stray.forEach(c => slots.push({ number: c.number ?? null, card: c, linked: null }));
    } else {
      slots = cardsForRarity.map(c => ({ number: c.number ?? null, card: c, linked: null }));
    }
    return { rarity: r, slots, effectiveTotal, isInferredTotal };
  });
  if (!rarityFilter){
    const knownNames = new Set((sub.rarities||[]).map(r => r.name));
    const orphan = sub.cards.filter(c => !knownNames.has(c.rarity));
    if (orphan.length) groups.push({ rarity: { name:'Unsorted', color:'#8d94a8' }, slots: orphan.map(c => ({ number: c.number ?? null, card: c, linked: null })), effectiveTotal: null, isInferredTotal: false });
  }
  return groups;
}

function renderBinderView(coll, sub){
  const groups = buildBinderSlots(coll, sub, ledgerRarityFilter);
  const flat = [];
  groups.forEach(g => g.slots.forEach(s => flat.push({ ...s, rarity: g.rarity })));

  const wrap = el('ledgerWrap');
  const pageSize = 9;

  if (flat.length === 0){
    const hasRarities = (sub.rarities||[]).length > 0;
    wrap.innerHTML = `<div class="empty-state">
      <div class="stamp">${hasRarities ? 'No slots to show' : 'No rarities defined yet'}</div>
      <div>${hasRarities ? 'Try a different rarity filter.' : 'Edit this series to add rarities with a quantity, and the binder will lay out every slot.'}</div>
    </div>`;
    return;
  }

  const totalPages = Math.max(1, Math.ceil(flat.length/pageSize));
  if (binderPage >= totalPages) binderPage = totalPages-1;
  if (binderPage < 0) binderPage = 0;
  const start = binderPage*pageSize;
  const pageSlots = flat.slice(start, start+pageSize);

  const pockets = pageSlots.map(s => {
    if (s.linked){
      const homeColl = getColl(s.linked.homeCollId);
      return `<div class="pocket linked-pocket" data-linked-coll="${s.linked.homeCollId}" data-linked-sub="${s.linked.homeSubId}" data-linked-card="${s.linked.card.id}" style="--rc:${s.rarity.color};">
        <div class="pocket-face" style="background:linear-gradient(160deg, ${homeColl?homeColl.color:'#555'} 0%, #14161d 85%);">
          <div class="pocket-mono">🔗</div>
          <div class="pocket-name">${escapeHtml(s.linked.card.name)}</div>
        </div>
        <div class="pocket-foot"><span style="color:${s.rarity.color}">${escapeHtml(s.rarity.name)}${s.number!=null ? ' #'+s.number : ''}</span><span>linked</span></div>
      </div>`;
    }
    if (!s.card){
      return `<div class="pocket empty-pocket" data-rarity="${escapeHtml(s.rarity.name)}" data-number="${s.number ?? ''}" style="--rc:${s.rarity.color};">
        <div class="pocket-face empty"><div class="pocket-slot-number">${s.number!=null ? '#'+s.number : '+'}</div></div>
        <div class="pocket-foot"><span style="color:${s.rarity.color}">${escapeHtml(s.rarity.name)}</span><span>empty</span></div>
      </div>`;
    }
    const c = s.card;
    return `<div class="pocket" data-id="${c.id}">
      <div class="pocket-face" data-face="${c.id}" style="--rc:${s.rarity.color}; background:linear-gradient(160deg, ${coll.color} 0%, #14161d 85%);">
        ${c.hasPhoto ? '' : `<div class="pocket-mono">${escapeHtml((c.name||'?').trim().charAt(0).toUpperCase())}</div>`}
        <div class="pocket-name">${escapeHtml(c.name)}</div>
      </div>
      <div class="pocket-foot">
        <span style="color:${s.rarity.color}">${escapeHtml(s.rarity.name)}${s.number!=null ? ' #'+s.number : ''}</span>
        <span>×${Number(c.qty||0)}</span>
      </div>
      <div class="tile-actions">
        <button data-act="edit-card" data-id="${c.id}" title="Edit">✎</button>
        <button data-act="del-card" data-id="${c.id}" title="Delete">✕</button>
      </div>
    </div>`;
  }).join('');

  wrap.innerHTML = `
    <div class="binder-page">${pockets}</div>
    <div class="binder-pager">
      <button id="binderPrev" ${binderPage===0?'disabled':''}>‹ Prev</button>
      <span>Page ${binderPage+1} of ${totalPages}</span>
      <button id="binderNext" ${binderPage>=totalPages-1?'disabled':''}>Next ›</button>
    </div>
  `;

  wrap.querySelectorAll('.pocket[data-id]').forEach(p => {
    p.onclick = (e) => { if (e.target.closest('.tile-actions')) return; openViewer(coll, sub, p.dataset.id); };
  });
  wrap.querySelectorAll('[data-act="edit-card"]').forEach(b => b.onclick = (e) => { e.stopPropagation(); openEditCard(coll.id, sub.id, b.dataset.id); });
  wrap.querySelectorAll('[data-act="del-card"]').forEach(b => b.onclick = (e) => { e.stopPropagation(); confirmDeleteCard(coll.id, sub.id, b.dataset.id); });
  wrap.querySelectorAll('.pocket.empty-pocket').forEach(p => {
    p.onclick = () => openAddCard(coll.id, sub.id, { rarity: p.dataset.rarity, number: p.dataset.number ? Number(p.dataset.number) : null });
  });
  wrap.querySelectorAll('.pocket.linked-pocket').forEach(p => {
    p.onclick = () => goToLinkedCard(p.dataset.linkedColl, p.dataset.linkedSub, p.dataset.linkedCard);
  });
  const prevBtn = el('binderPrev'); if (prevBtn) prevBtn.onclick = () => { binderPage--; renderBinderView(coll, sub); };
  const nextBtn = el('binderNext'); if (nextBtn) nextBtn.onclick = () => { binderPage++; renderBinderView(coll, sub); };

  pageSlots.filter(s => s.card && s.card.hasPhoto).forEach(s => {
    window.storage.get(photoKey(s.card.id), false).then(res => {
      if (res && res.value){
        const face = wrap.querySelector(`.pocket-face[data-face="${s.card.id}"]`);
        if (face){
          face.style.backgroundImage = `url(${res.value})`;
          face.style.backgroundSize = 'cover';
          face.style.backgroundPosition = 'center';
          face.style.backgroundRepeat = 'no-repeat';
        }
      }
    }).catch(() => {});
  });
}

function renderOverviewView(coll, sub){
  const groups = buildBinderSlots(coll, sub, ledgerRarityFilter);
  const wrap = el('ledgerWrap');

  if (groups.length === 0 || groups.every(g => g.slots.length === 0)){
    wrap.innerHTML = `<div class="empty-state">
      <div class="stamp">Nothing to show yet</div>
      <div>Edit this series to add rarities with a quantity, and the whole binder will lay out here at a glance.</div>
    </div>`;
    return;
  }

  const sections = groups.map(g => {
    const owned = g.slots.filter(s => (s.card && Number(s.card.qty||0) > 0) || s.linked).length;
    const isComplete = g.rarity.total && owned >= g.rarity.total;
    const label = g.rarity.total ? `${owned} / ${g.rarity.total}`
      : g.isInferredTotal ? `${owned} / ${g.effectiveTotal}+ (no target set)`
      : `${owned} owned`;
    const chips = g.slots.map(s => {
      if (s.linked){
        return `<div class="slot-chip linked" data-linked-coll="${s.linked.homeCollId}" data-linked-sub="${s.linked.homeSubId}" data-linked-card="${s.linked.card.id}" style="background:${g.rarity.color};" title="${escapeHtml(s.linked.card.name)} — linked from another series${s.number!=null ? ' · #'+s.number : ''}">${s.number!=null ? s.number : '🔗'}</div>`;
      }
      if (s.card){
        return `<div class="slot-chip filled" data-id="${s.card.id}" style="background:${g.rarity.color};" title="${escapeHtml(s.card.name)}${s.number!=null ? ' · #'+s.number : ''}">${s.number!=null ? s.number : '✓'}</div>`;
      }
      return `<div class="slot-chip empty" data-rarity="${escapeHtml(g.rarity.name)}" data-number="${s.number ?? ''}" style="border-color:${g.rarity.color};" title="Empty — click to add${s.number!=null ? ' #'+s.number : ''}">${s.number!=null ? s.number : '?'}</div>`;
    }).join('');
    return `<div class="overview-section">
      <div class="overview-head"><span style="color:${g.rarity.color}">${escapeHtml(g.rarity.name)}${isComplete ? ' <span class="badge-complete-mini" title="Complete">✓</span>' : ''}</span><span>${label}</span></div>
      <div class="overview-chips">${chips}</div>
    </div>`;
  }).join('');

  wrap.innerHTML = `<div class="overview-wrap">${sections}</div>`;

  wrap.querySelectorAll('.slot-chip.filled').forEach(c => {
    c.onclick = () => openViewer(coll, sub, c.dataset.id);
  });
  wrap.querySelectorAll('.slot-chip.empty').forEach(c => {
    c.onclick = () => openAddCard(coll.id, sub.id, { rarity: c.dataset.rarity, number: c.dataset.number ? Number(c.dataset.number) : null });
  });
  wrap.querySelectorAll('.slot-chip.linked').forEach(c => {
    c.onclick = () => goToLinkedCard(c.dataset.linkedColl, c.dataset.linkedSub, c.dataset.linkedCard);
  });
}

let pendingCollLogo = { dataUrl: null, remove: false };
function logoKey(collId){ return 'collection-logo:' + collId; }
function resetCollLogoField(){
  pendingCollLogo = { dataUrl: null, remove: false };
  el('collLogoInput').value = '';
  el('collLogoPreview').style.backgroundImage = '';
  el('removeCollLogoBtn').style.display = 'none';
}
el('collLogoInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const resized = resizeImageToDataUrl(img, 400);
      pendingCollLogo = { dataUrl: resized, remove: false };
      el('collLogoPreview').style.backgroundImage = `url(${resized})`;
      el('removeCollLogoBtn').style.display = 'inline-block';
      const hex = extractDominantColor(img);
      if (hex){ el('collColor').value = hex; showToast('Theme color updated to match the logo'); }
    };
    img.onerror = () => showToast('Could not load that image');
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};
el('removeCollLogoBtn').onclick = () => {
  pendingCollLogo = { dataUrl: null, remove: true };
  el('collLogoPreview').style.backgroundImage = '';
  el('collLogoInput').value = '';
  el('removeCollLogoBtn').style.display = 'none';
};

function openAddCollection(){
  editing.collId = null;
  el('collModalTitle').textContent = 'New collection';
  el('collName').value = '';
  el('collColor').value = randomColor();
  el('deleteCollBtn').style.display = 'none';
  resetBoxPhotoField();
  resetCollLogoField();
  el('collOverlay').classList.add('open');
  el('collName').focus();
}
async function openEditCollection(id){
  const c = getColl(id);
  if (!c) return;
  editing.collId = id;
  el('collModalTitle').textContent = 'Edit collection';
  el('collName').value = c.name;
  el('collColor').value = c.color;
  el('deleteCollBtn').style.display = 'inline-block';
  resetBoxPhotoField();
  resetCollLogoField();
  el('collOverlay').classList.add('open');
  if (c.hasLogo){
    try{
      const res = await window.storage.get(logoKey(c.id), false);
      if (res && res.value){
        el('collLogoPreview').style.backgroundImage = `url(${res.value})`;
        el('removeCollLogoBtn').style.display = 'inline-block';
      }
    }catch(e){ /* logo missing or unreadable — leave preview blank */ }
  }
}
function renderRarityManageList(){

    return;
  }
  wrap.innerHTML = pendingRarities.map((r,i) => `
    <div class="rarity-manage-row">
      <input type="color" data-i="${i}" class="rc-color" value="${r.color}" />
      <input type="text" data-i="${i}" class="rc-name" value="${escapeHtml(r.name)}" />
      <input type="number" min="0" data-i="${i}" class="rc-total" value="${r.total ?? ''}" placeholder="Qty" />
      <button data-i="${i}" class="rc-del" type="button">✕</button>

function extractDominantColor(img){
  const size = 60;
  const canvas = el('colorCanvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,size,size);
  // cover-fit the image into the square sample so we don't skew toward letterboxed edges
  const scale = Math.max(size/img.width, size/img.height);
  const w = img.width*scale, h = img.height*scale;
  ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
  let data;
  try { data = ctx.getImageData(0,0,size,size).data; } catch(e){ return null; }
  const buckets = {};
  for (let i=0;i<data.length;i+=4){
    const r=data[i], g=data[i+1], b=data[i+2], a=data[i+3];
    if (a < 128) continue;
    if (r>235 && g>235 && b>235) continue; // skip near-white background/glare
    if (r<18 && g<18 && b<18) continue;    // skip near-black shadow
    const key = Math.round(r/24)+','+Math.round(g/24)+','+Math.round(b/24);
    if (!buckets[key]) buckets[key] = { count:0, r:0, g:0, b:0 };
    const bucket = buckets[key];
    bucket.count++; bucket.r+=r; bucket.g+=g; bucket.b+=b;
  }
  let best = null;
  Object.values(buckets).forEach(bucket => { if (!best || bucket.count > best.count) best = bucket; });
  if (!best) return null;
  const r = Math.round(best.r/best.count), g = Math.round(best.g/best.count), b = Math.round(best.b/best.count);
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

function resizeImageToDataUrl(img, maxSide){
  let w = img.width, h = img.height;
  if (w > h && w > maxSide){ h = Math.round(h * (maxSide/w)); w = maxSide; }
  else if (h >= w && h > maxSide){ w = Math.round(w * (maxSide/h)); h = maxSide; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', 0.78);
}

let viewerTiltY = 0;
let viewerContext = { collId: null, subId: null, cardId: null };

function updateCard3dTransform(){
  const c3d = el('card3d');
  const flipDeg = viewerFlipped ? 180 : 0;
  c3d.style.transform = `rotateX(${viewerTiltX}deg) rotateY(${viewerTiltY + flipDeg}deg)`;
}

function goToLinkedCard(homeCollId, homeSubId, cardId){
  const homeColl = getColl(homeCollId);
  const homeSub = homeColl ? getSub(homeCollId, homeSubId) : null;
  if (!homeColl || !homeSub){ showToast('That card\'s home series no longer exists'); return; }
  nav.collectionId = homeCollId;
  nav.subId = homeSubId;
  render();
  openViewer(homeColl, homeSub, cardId);
}

async function openViewer(coll, sub, cardId){
  const card = sub.cards.find(c => c.id === cardId);
  if (!card) return;
  viewerContext = { collId: coll.id, subId: sub.id, cardId: card.id };
  const rarity = (sub.rarities||[]).find(r => r.name === card.rarity);
  const fx = EFFECTS[card.effect] || EFFECTS.matte;

  const cBase = el('cBase');
  cBase.style.backgroundImage = 'none';
  cBase.style.background = `linear-gradient(160deg, ${coll.color} 0%, #14161d 85%)`;
  el('cFx').className = 'c-fx fx-' + (card.effect||'matte');
  el('cEyebrow').textContent = `${coll.name} · ${sub.name}`;
  el('cTitle').textContent = card.name;
  el('cRing').textContent = (card.name||'?').trim().charAt(0).toUpperCase();
  el('cRarity').textContent = card.rarity || '—';
  el('cRarity').style.color = rarity ? rarity.color : 'inherit';
  el('cQty').textContent = '×' + Number(card.qty||0);

  el('vName').textContent = `${card.name}`;
  viewerFrontHint = `${fx.glyph} ${fx.label} — move your mouse over the card to see the ${fx.label.toLowerCase()} effect.`;
  el('vHint').textContent = viewerFrontHint;
  el('vNotes').textContent = card.notes || '';

  document.querySelector('.c-emblem').style.display = card.hasPhoto ? 'none' : '';

  // Back face: reset to a neutral placeholder, then fill in if a photo exists.
  const cBaseBack = el('cBaseBack');
  cBaseBack.style.backgroundImage = 'none';
  cBaseBack.style.background = `linear-gradient(160deg, #14161d 0%, ${coll.color} 130%)`;
  el('cBackPlaceholder').textContent = card.hasBackPhoto ? '' : 'No back photo added yet';

  // Reset flip + tilt state for the new card.
  viewerFlipped = false;
  viewerTiltX = 0; viewerTiltY = 0;
  const c3d = el('card3d');
  c3d.classList.remove('live');
  updateCard3dTransform();
  c3d.style.setProperty('--rx', 0);
  c3d.style.setProperty('--ry', 0);
  el('flipCardBtn').textContent = '⟲ Flip to back';

  el('viewerOverlay').classList.add('open');

  if (card.hasPhoto){
    try{
      const res = await window.storage.get(photoKey(card.id), false);
      if (res && res.value){
        cBase.style.background = 'none';
        cBase.style.backgroundImage = `url(${res.value})`;
        cBase.style.backgroundSize = 'cover';
        cBase.style.backgroundPosition = 'center';
        cBase.style.backgroundRepeat = 'no-repeat';
      }
    }catch(e){ /* fall back silently to the generated design already drawn above */ }
  }

  if (card.hasBackPhoto){
    try{
      const res = await window.storage.get(photoBackKey(card.id), false);
      if (res && res.value){
        cBaseBack.style.background = 'none';
        cBaseBack.style.backgroundImage = `url(${res.value})`;
        cBaseBack.style.backgroundSize = 'cover';
        cBaseBack.style.backgroundPosition = 'center';
        cBaseBack.style.backgroundRepeat = 'no-repeat';
      }
    }catch(e){ /* fall back silently to the placeholder already shown */ }
  }

  const stage = document.querySelector('.stage-wrap');

  function onMove(e){
    const rect = c3d.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width;
    const py = (e.clientY - rect.top) / rect.height;
    viewerTiltX = (0.5 - py) * 22;
    viewerTiltY = (px - 0.5) * 26;
    c3d.classList.add('live');
    updateCard3dTransform();
    c3d.style.setProperty('--rx', viewerTiltX.toFixed(2));
    c3d.style.setProperty('--ry', viewerTiltY.toFixed(2));
    c3d.style.setProperty('--mx', (px*100).toFixed(1)+'%');
    c3d.style.setProperty('--my', (py*100).toFixed(1)+'%');
  }
  function onLeave(){
    c3d.classList.remove('live');
    viewerTiltX = 0; viewerTiltY = 0;
    updateCard3dTransform();
    c3d.style.setProperty('--rx', 0);
    c3d.style.setProperty('--ry', 0);
  }
  stage.onmousemove = onMove;
  stage.onmouseleave = onLeave;
}
let viewerFrontHint = 'Move your mouse over the card to tilt it.';

el('flipCardBtn').onclick = () => {
  viewerFlipped = !viewerFlipped;
  updateCard3dTransform();
  el('flipCardBtn').textContent = viewerFlipped ? '⟲ Flip to front' : '⟲ Flip to back';
  el('vHint').textContent = viewerFlipped ? 'Showing the back of the card.' : viewerFrontHint;
};
el('viewerEditBtn').onclick = () => {
  const { collId, subId, cardId } = viewerContext;
  el('viewerOverlay').classList.remove('open');
  openEditCard(collId, subId, cardId);
};
el('viewerDeleteBtn').onclick = () => {
  const { collId, subId, cardId } = viewerContext;
  el('viewerOverlay').classList.remove('open');
  confirmDeleteCard(collId, subId, cardId);
};
el('viewerClose').onclick = () => el('viewerOverlay').classList.remove('open');
el('viewerOverlay').addEventListener('click', (e) => { if (e.target.id === 'viewerOverlay') el('viewerOverlay').classList.remove('open'); });

el('addCollBtn').onclick = openAddCollection;
loadData();
</script>
</body>
</html>
